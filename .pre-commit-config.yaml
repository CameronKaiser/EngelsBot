---
repos:
  # Misc checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files # Require LFS for files over 500kB
      - id: check-merge-conflict # Make sure merge conflicts are fixed
      - id: check-yaml

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.29.0
    hooks:
      - id: yamllint
        args: [--strict, '-d', "{rules: {line-length: {max: 180}}}"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.12
    hooks:
      # Run the linter. No ruff-format: this codebase uses hand-aligned
      # formatting (aligned colons/assignments) that ruff-format would destroy.
      - id: ruff-check
        args: [ --fix ]
